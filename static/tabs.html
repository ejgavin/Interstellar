<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" id="tab-favicon" href="favicon.png" />
    <title id="t">Home</title>
    <link rel="stylesheet" href="/assets/css/global.css?v=6" />
    <link rel="stylesheet" href="/assets/css/t.css?v=02" />
    <style>
      #blocker {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.95);
        color: white;
        font-size: 24px;
        z-index: 9999;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 30px;
        text-align: center;
      }

      #blocker p {
        margin-bottom: 20px;
      }
    </style>
    <script src="/assets/js/f.js"></script>
    <script>
      window.addEventListener("resize", () => {
        if (navigator.keyboard && navigator.keyboard.lock) {
          navigator.keyboard.lock(["Escape"]);
        }
      });

      const allowedAgents = [
        "Mozilla/5.0 (X11; CrOS x86_64 14541.0.0) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36",
        "Mozilla/5.0 (X11; CrOS x86_64 14541.0.0) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/135.0.0.0 Safari/537.36"
      ];

      window.onload = () => {
        try {
          const ua = navigator.userAgent;
          const blocker = document.getElementById("blocker");
          if (!blocker) return;
          if (!allowedAgents.includes(ua)) {
            blocker.style.display = "flex";
          }
        } catch (e) {
          console.error("Error in user agent check:", e);
        }
      };
    </script>
  </head>
  <body id="no">
    <div id="blocker">
      <p><strong>Sorry!</strong> You must be on a Chromebook to use this.</p>
      <p>Also, if you're a teacher, please don't report this lol.</p>
    </div>

    <nav class="nav" id="right-side-nav">
      <ul id="tab-list"></ul>
      <button title="add-tab" id="add-tab">
        <i class="fa-solid fa-plus"></i>
      </button>
    </nav>

    <div class="nav-bar">
      <div class="nav-container">
        <div class="nav-left">
          <button
            title="Home Page"
            id="home-page"
            class="nav-button"
            onclick="Home()"
          >
            <i class="fa-solid fa-house"></i>
          </button>
          <button title="Back Arrow" class="nav-button" onclick="goBack()">
            <i class="fa-solid fa-arrow-left"></i>
          </button>
          <button
            title="Forward Arrow"
            class="nav-button"
            onclick="goForward()"
          >
            <i class="fa-solid fa-arrow-right"></i>
          </button>
          <button title="Reload" onclick="reload()" class="nav-button">
            <i class="fa-solid fa-rotate-right"></i>
          </button>
          <form id="fv" class="navpost" method="POST">
            <input
              id="iv"
              class="bar"
              placeholder="Search or enter a new URL"
              type="text"
            />
          </form>
        </div>
        <div class="nav-right">
          <button
            title="Fullscreen"
            id="fullscreen-button"
            class="nav-button nav-btn-right"
            onclick="FS()"
          >
            <i class="fa-solid fa-expand"></i>
          </button>
          <button
            title="Window Popout"
            id="popout-button"
            class="nav-button nav-btn-right"
            onclick="popout()"
          >
            <i class="fa-solid fa-up-right-from-square"></i>
          </button>
          <button
            title="Inspect"
            class="nav-button nav-btn-right"
            onclick="eToggle()"
          >
            <i class="fa-solid fa-code"></i>
          </button>
          <button
            title="Tabs"
            id="tabs-button"
            class="nav-button nav-btn-right"
          >
            <i class="fa-solid fa-magnifying-glass-minus"></i>
          </button>
        </div>
      </div>
    </div>

    <div class="frame-container" id="frame-container"></div>

    <script src="/assets/js/t.js?v=03"></script>
    <script src="/assets/ultra/bundle.js?v=10-02-2024"></script>
    <script src="/assets/ultra/config.js?v=10-02-2024"></script>
    <script src="/assets/js/m.js?v=08"></script>

  </body>
</html>
